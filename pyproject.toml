[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mips-tool"
version = "0.1.0"
description = "MIPS32/64 instruction encoder, decoder, and bitfield explainer"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Sabneet Bains" }]
keywords = ["mips", "assembler", "disassembler", "computer-architecture", "reverse-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Assemblers",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.10", "pytest>=8.0", "ruff>=0.8"]

[project.scripts]
mips-tool = "mips_tool.cli:main"

[project.urls]
Repository = "https://github.com/sabneet-bains/Reverse-Engineering"
Issues = "https://github.com/sabneet-bains/Reverse-Engineering/issues"

[tool.setuptools.packages.find]
include = ["mips_tool*"]
exclude = ["assets*", "docs*", "examples*", "tests*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
