<svg width="1042" height="442" viewBox="79 59 1042 442" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MIPS bitfield encoder and decoder hero diagram</title>
  <desc id="desc">Assembly text flows into MIPS instruction fields and produces binary and hexadecimal machine code.</desc>
  <defs>
    <linearGradient id="panel" x1="80" y1="60" x2="1120" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.62" stop-color="#111827"/>
      <stop offset="1" stop-color="#10151F"/>
    </linearGradient>
    <linearGradient id="accent" x1="170" y1="105" x2="1030" y2="455" gradientUnits="userSpaceOnUse">
      <stop stop-color="#528EC5"/>
      <stop offset="0.48" stop-color="#8E44AD"/>
      <stop offset="1" stop-color="#2ECC71"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#72B7F2"/>
      <stop offset="1" stop-color="#528EC5"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EC6EA5"/>
      <stop offset="1" stop-color="#8E44AD"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#65E6A2"/>
      <stop offset="1" stop-color="#2ECC71"/>
    </linearGradient>
  </defs>

  <rect x="80" y="60" width="1040" height="440" rx="18" fill="url(#panel)" stroke="#30363D" stroke-width="2"/>
  <path d="M100 62 H1100" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity="0.95"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="130" y="128" fill="#F8FAFC" font-size="34" font-weight="800">Syntax to silicon, demystified.</text>
    <text x="132" y="160" fill="#94A3B8" font-size="16">MIPS32/64 instructions, machine words, and inspectable bitfields.</text>
  </g>

  <g font-family="Consolas, Menlo, monospace">
    <rect x="130" y="225" width="255" height="76" rx="12" fill="#0B1220" stroke="#273449"/>
    <text x="154" y="256" fill="#94A3B8" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif">assembly</text>
    <text x="154" y="282" fill="#E5E7EB" font-size="18">ld $t0, 16($sp)</text>

    <path d="M415 263 H474" stroke="#64748B" stroke-width="2.5"/>
    <path d="M474 263 L462 254 M474 263 L462 272" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>

    <rect x="505" y="225" width="250" height="76" rx="12" fill="#0B1220" stroke="#273449"/>
    <text x="529" y="256" fill="#94A3B8" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif">I-type fields</text>
    <text x="529" y="282" fill="#CBD5E1" font-size="17">opcode rs rt immediate</text>

    <path d="M785 263 H844" stroke="#64748B" stroke-width="2.5"/>
    <path d="M844 263 L832 254 M844 263 L832 272" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>

    <rect x="875" y="225" width="195" height="76" rx="12" fill="#0B1220" stroke="#273449"/>
    <text x="899" y="256" fill="#94A3B8" font-size="14" font-family="Inter, Segoe UI, Arial, sans-serif">machine word</text>
    <text x="899" y="282" fill="#A7F3D0" font-size="18">0xDFA80010</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <rect x="130" y="372" width="150" height="58" rx="10" fill="url(#blue)"/>
    <text x="205" y="396" fill="#08111F">opcode</text>
    <text x="205" y="418" fill="#08111F" font-family="Consolas, Menlo, monospace">110111</text>

    <rect x="292" y="372" width="130" height="58" rx="10" fill="#1F2937" stroke="#528EC5"/>
    <text x="357" y="396" fill="#E0F2FE">rs</text>
    <text x="357" y="418" fill="#BAE6FD" font-family="Consolas, Menlo, monospace">11101</text>

    <rect x="434" y="372" width="130" height="58" rx="10" fill="#1F2937" stroke="#8E44AD"/>
    <text x="499" y="396" fill="#F5D0FE">rt</text>
    <text x="499" y="418" fill="#F0ABFC" font-family="Consolas, Menlo, monospace">01000</text>

    <rect x="576" y="372" width="300" height="58" rx="10" fill="url(#pink)"/>
    <text x="726" y="396" fill="#FDF2F8">immediate</text>
    <text x="726" y="418" fill="#FDF2F8" font-family="Consolas, Menlo, monospace">0000000000010000</text>

    <rect x="888" y="372" width="182" height="58" rx="10" fill="url(#green)"/>
    <text x="979" y="396" fill="#052E16">meaning</text>
    <text x="979" y="418" fill="#052E16" font-family="Consolas, Menlo, monospace">ld $t0, 16($sp)</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle">
    <text x="205" y="464" fill="#64748B">opcode</text>
    <text x="357" y="464" fill="#64748B">base register</text>
    <text x="499" y="464" fill="#64748B">target register</text>
    <text x="726" y="464" fill="#64748B">signed offset</text>
    <text x="979" y="464" fill="#64748B">canonical assembly</text>
  </g>
</svg>
